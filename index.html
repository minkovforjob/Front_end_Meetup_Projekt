<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Document</title>
</head>

<body>
    <div class="workSpace">
        <div class="navbar">

            <div class="leftNav">

                <img src="/assets/icon/logo.svg" alt="logo" class="logo" />
                <form class="searchBar">

                    <div class="searchField">
                        <span class="material-symbols-rounded searchIcon">
                            search
                        </span>

                        <input type="text" placeholder="Search events" aria-label="Search events">
                    </div>

                    <div class="locationField">
                        <input type="text" value="Mountain View, CA" aria-label="Location">
                    </div>

                    <button type="submit" aria-label="Search">
                        <span class="material-symbols-rounded">search</span>
                    </button>
                </form>
            </div>

            <div class="btnCont">
                <button><img src="/assets/icon/Planet.svg" alt="Planet">English</button>

                <button>Log in</button>
                <button class="btnSingUp">Sign up</button>
            </div>

        </div>
</body>
<script src="/scripts/script.js"></script>

</html>
