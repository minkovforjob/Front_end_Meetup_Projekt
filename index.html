<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Document</title>
</head>

<body>

    <div class="navbar">
        <img src="/assets/icon/logo.svg" alt="logo" class="logo" />
        <form class="searchBar">

            <div class="searchField">
                <span class="material-symbols-rounded searchIcon">
                    search
                </span>
                <input type="text" placeholder="Search events" aria-label="Search events">
            </div>

            <div class="locationField">
                <input type="text" value="Mountain View, CA" aria-label="Location">
            </div>
            <button type="submit" aria-label="Search">
                <span class="material-symbols-rounded">search</span>
            </button>
        </form>

        <div class="btnCont">
            <button class="btnEnglish"><img src="/assets/icon/Planet.svg" alt="Planet">English</button>
            <button class="btnLogin">Log in</button>
            <button class="btnSingUp">Sign up</button>
        </div>
    </div>


    <div class="main">
        <section class="peoplePlatform">
            <div class="flexSetting">
                <h2>
                    The people platform—Where interests become friendships
                </h2>
                <p>Whatever your interest, from hiking and reading to networking and skill sharing,
                    there are thousands of people who share it on Meetup. Events are happening
                    every day—sign up to join the fun.</p>
                <button> Join Meetup</button>
            </div>
            <div class="flexSetting">
                <img src="/assets/img/irl_event.png" alt="irl_event">
            </div>
        </section>
    </div>
</body>
<script src="/scripts/script.js"></script>

</html>
